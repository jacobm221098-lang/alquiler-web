<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlquilaCR — Alquilá de todo en Costa Rica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>

<body>
  <header class="site-header">
    <div class="header-top">
      <div class="logo">ALQUILA<span>CR</span></div>
      <div class="header-acciones">
        <button id="btn-publicar" class="btn-publicar" type="button">+ Publicar</button>
        <!-- Zona de cuenta: auth.js la llena con el botón o el usuario. -->
        <div id="auth-zona" class="auth-zona"></div>
      </div>
    </div>
    <p class="tagline">Casas, vehículos, maquinaria, equipo para eventos y más — todo en un solo lugar.</p>
  </header>

  <!-- ====== CATEGORÍAS (la navegación principal) ======
       Son el centro de la experiencia. Grandes y claras. -->
  <nav class="categorias" id="categorias" aria-label="Categorías"></nav>

  <main>
    <!-- ====== FILTROS (compactos, en una sola fila discreta) ====== -->
    <section class="barra-filtros" aria-label="Filtros">
      <input type="search" id="buscador" placeholder="🔎 Buscar…" aria-label="Buscar" />
      <select id="f-provincia" aria-label="Provincia">
        <option value="">Toda Costa Rica</option>
      </select>
      <select id="f-orden" aria-label="Ordenar">
        <option value="recientes">Más recientes</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
      </select>
    </section>

    <div id="banner-mias" class="banner-mias">
      <span>📋 Mostrando tus publicaciones</span>
      <button id="ver-todo" type="button">Ver todo</button>
    </div>

    <p id="contador" class="contador" aria-live="polite"></p>

    <section id="lista" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>© 2026 ALQUILACR · Práctica de desarrollo web · Hecho en Costa Rica 🇨🇷</p>
  </footer>

  <!-- ====== MODAL DE CUENTA (registro / login) ======
       Oculto por defecto; auth.js le agrega la clase "abierto". -->
  <div id="auth-modal" class="auth-modal" role="dialog" aria-modal="true">
    <div class="auth-caja">
      <button id="auth-cerrar" class="auth-cerrar" type="button" aria-label="Cerrar">✕</button>
      <h2 id="auth-titulo">Crear cuenta</h2>
      <form id="auth-form">
        <label for="auth-email">Correo</label>
        <input type="email" id="auth-email" required autocomplete="email" />
        <label for="auth-pass">Contraseña</label>
        <input type="password" id="auth-pass" required minlength="6" autocomplete="current-password" />
        <button id="auth-submit" type="submit">Registrarme</button>
      </form>
      <p id="auth-msg" class="auth-msg" aria-live="polite"></p>
      <button id="auth-toggle" class="auth-toggle" type="button">¿Ya tenés cuenta? <b>Iniciá sesión</b></button>
      <button id="auth-reset" class="auth-toggle" type="button" style="display:none">¿Olvidaste tu contraseña?</button>
    </div>
  </div>

  <!-- ====== MODAL PUBLICAR ANUNCIO ====== -->
  <div id="pub-modal" class="auth-modal" role="dialog" aria-modal="true">
    <div class="auth-caja pub-caja">
      <button id="pub-cerrar" class="auth-cerrar" type="button" aria-label="Cerrar">✕</button>
      <h2>Publicar anuncio</h2>
      <form id="pub-form">
        <label for="pub-categoria">Categoría</label>
        <select id="pub-categoria" name="categoria" required></select>

        <label for="pub-titulo">Título</label>
        <input type="text" id="pub-titulo" name="titulo" required placeholder="Ej: Apartamento 2 cuartos en Escazú" />

        <div class="pub-fila">
          <div>
            <label for="pub-provincia">Provincia</label>
            <select id="pub-provincia" name="provincia" required></select>
          </div>
          <div>
            <label for="pub-canton">Cantón</label>
            <input type="text" id="pub-canton" name="canton" placeholder="Ej: Escazú" />
          </div>
        </div>

        <div class="pub-fila">
          <div>
            <label for="pub-precio">Precio ($)</label>
            <input type="number" id="pub-precio" name="precio" required min="1" placeholder="850" />
          </div>
          <div>
            <label for="pub-unidad">Por</label>
            <select id="pub-unidad" name="unidad" required>
              <option value="mes">mes</option>
              <option value="día">día</option>
            </select>
          </div>
        </div>

        <label for="pub-descripcion">Descripción corta</label>
        <input type="text" id="pub-descripcion" name="descripcion" placeholder="Ej: 2 hab, 1 baño, amueblado" />

        <label for="pub-foto">Foto (URL, opcional)</label>
        <input type="url" id="pub-foto" name="foto" placeholder="https://..." />

        <label for="pub-contacto">WhatsApp (número con 506)</label>
        <input type="text" id="pub-contacto" name="contacto" required placeholder="50688887777" />

        <button type="submit">Publicar</button>
      </form>
      <p id="pub-msg" class="auth-msg" aria-live="polite"></p>
    </div>
  </div>

  <!-- supabase-js: el cliente que habla con el backend (desde el CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="auth.js?v=4" defer></script>
  <script src="app.js?v=11" defer></script>
</body>
</html>
