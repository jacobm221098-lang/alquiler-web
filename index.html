<!DOCTYPE html>
<!-- Le dice al navegador: "esto es HTML moderno (HTML5)". Siempre va de primero. -->
<html lang="es">
<head>
  <!-- El <head> NO se ve en la página: son instrucciones y metadatos para el navegador. -->

  <!-- charset: cómo interpretar los caracteres. utf-8 = soporta tildes, ñ, emojis. -->
  <meta charset="UTF-8" />

  <!-- viewport: CLAVE para celulares. Le dice al móvil "usá el ancho real del
       dispositivo", sin esto la página se ve chiquita y alejada en el teléfono. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- El texto de la pestaña del navegador y lo que usa Google. -->
  <title>Alquileres CR — Propiedades en renta</title>

  <!-- Enlazamos nuestro archivo de diseño (CSS). "rel" dice qué tipo de relación. -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- El <body> SÍ es todo lo visible. -->

  <!-- <header>: encabezado del sitio. Las etiquetas "semánticas" (header, main,
       footer, section) le dan SIGNIFICADO al contenido, no solo forma. Ayudan a
       Google y a los lectores de pantalla a entender la página. -->
  <header class="site-header">
    <h1>Alquileres CR</h1>
    <p>Propiedades en renta — solo alquiler</p>
  </header>

  <main>
    <!-- Barra de búsqueda/filtro simple. El input lo leeremos desde JavaScript. -->
    <section class="filtros">
      <input
        type="search"
        id="buscador"
        placeholder="Buscar por ubicación o título…"
        aria-label="Buscar propiedades"
      />
    </section>

    <!-- AQUÍ está el truco de "datos vs presentación":
         este contenedor está VACÍO en el HTML. JavaScript lo va a llenar con las
         tarjetas de propiedades a partir de la lista de datos. Así el HTML no
         repite 10 veces la misma estructura. -->
    <section id="lista-propiedades" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Alquileres CR · Hecho como práctica de desarrollo web</p>
  </footer>

  <!-- Cargamos el JavaScript al FINAL del body a propósito: así el navegador ya
       dibujó el HTML antes de ejecutar el script, y el script encuentra los
       elementos que necesita. "defer" refuerza esa idea. -->
  <script src="app.js" defer></script>
</body>
</html>
